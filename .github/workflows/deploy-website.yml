name: Deploy website

# Deploys packages/website to the shuvtunnel-website Worker (shuv.zip) whenever the site changes on
# master. Needs two repository secrets from the Cloudflare account that owns the shuv.zip zone:
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts: Edit and Workers Routes: Edit (zone: shuv.zip)
#   CLOUDFLARE_ACCOUNT_ID  that account's ID
# and the repository variable SHUVTUNNEL_DEPLOY_WEBSITE=true. Until all three are set, the job skips.

on:
  push:
    branches: [master]
    paths:
      - "packages/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy shuv.zip
    if: github.repository == 'shuv1337/shuvtunnel'
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ vars.SHUVTUNNEL_DEPLOY_WEBSITE == 'true' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.CONFIGURED != 'true'
        run: echo "SHUVTUNNEL_DEPLOY_WEBSITE / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."

      - if: env.CONFIGURED == 'true'
        uses: actions/checkout@v6

      - if: env.CONFIGURED == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - if: env.CONFIGURED == 'true'
        run: bun install --frozen-lockfile

      - if: env.CONFIGURED == 'true'
        run: bun run build
        working-directory: packages/website

      - if: env.CONFIGURED == 'true'
        run: bunx wrangler deploy
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
